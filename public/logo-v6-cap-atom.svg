<svg viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg">
  <!-- Cap body -->
  <path d="M20,26 L20,46 Q20,53 34,53 Q48,53 48,46 L48,26 L34,35 Z" fill="#1a73e8"/>

  <!-- Mortar board — wide diamond so atom fits inside -->
  <polygon points="34,6 68,22 34,38 0,22" fill="#1a73e8"/>

  <!-- Edge highlight -->
  <path d="M20,26 L34,35 L48,26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>

  <!-- Tassel cord -->
  <line x1="68" y1="22" x2="68" y2="38" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel bob -->
  <ellipse cx="68" cy="42" rx="3.5" ry="4.5" fill="#1a73e8"/>

  <!-- Atom nucleus -->
  <circle cx="34" cy="21" r="3.2" fill="#29b6f6"/>

  <!-- Orbit 1 (horizontal) -->
  <ellipse cx="34" cy="21" rx="12" ry="4.5" fill="none" stroke="#29b6f6" stroke-width="1.7"/>

  <!-- Orbit 2 (60°) -->
  <ellipse cx="34" cy="21" rx="12" ry="4.5" fill="none" stroke="#29b6f6" stroke-width="1.7" transform="rotate(60 34 21)"/>

  <!-- Orbit 3 (120°) -->
  <ellipse cx="34" cy="21" rx="12" ry="4.5" fill="none" stroke="#29b6f6" stroke-width="1.7" transform="rotate(120 34 21)"/>

  <!-- Text — single element, no gap between Pre and Fiz -->
  <text y="41" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.4">
    <tspan x="80" fill="#1a73e8">Pre</tspan><tspan fill="#29b6f6">Fiz</tspan>
  </text>
</svg>
